<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="55%" stop-color="#0a0f2c"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee">
        <animate attributeName="offset" values="1;0.6;1" dur="6s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="translate" values="-200 0;200 0;-200 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8b5cf6" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <circle cx="150" cy="80" r="180" fill="url(#glowPurple)">
    <animate attributeName="r" values="160;200;160" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="260" r="200" fill="url(#glowCyan)">
    <animate attributeName="r" values="180;220;180" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- floating particles -->
  <g fill="#22d3ee">
    <circle cx="120" cy="60" r="2.5" opacity="0.8"><animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="70" r="2" opacity="0.7"><animate attributeName="cy" values="70;95;70" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="40" r="1.8" opacity="0.6"><animate attributeName="cy" values="40;60;40" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#8b5cf6">
    <circle cx="300" cy="260" r="2.2" opacity="0.7"><animate attributeName="cy" values="260;235;260" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="250" r="2.6" opacity="0.75"><animate attributeName="cy" values="250;275;250" dur="6s" repeatCount="indefinite"/></circle>
  </g>

  <line x1="60" y1="118" x2="1140" y2="118" stroke="url(#textGrad)" stroke-width="1" opacity="0.35"/>

  <text x="600" y="160" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="54" font-weight="700" fill="url(#textGrad)" filter="url(#softGlow)" letter-spacing="2">
    MUKESHKUMAR PRAJAPATI
  </text>

  <text x="600" y="200" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="19" font-weight="400" fill="#a3adc2" letter-spacing="1.5">
    AI &amp; NLP Engineer&#160;&#8226;&#160;Software Architect&#160;&#8226;&#160;IEEE Published Researcher
  </text>

  <line x1="60" y1="228" x2="1140" y2="228" stroke="url(#textGrad)" stroke-width="1" opacity="0.35"/>

  <text x="600" y="270" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="14" fill="#6b7793" letter-spacing="3">
    HEIDELBERG UNIVERSITY &#8226; COMPUTATIONAL LINGUISTICS (AI &amp; NLP)
  </text>
</svg>
